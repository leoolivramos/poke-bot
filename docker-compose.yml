version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pokebot_api
    ports:
      - "8000:8000"
    environment:
      - HF_HOME=/data
    volumes:
      - ./data:/code/data
      - ./models:/code/models
    restart: unless-stopped

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pokebot_telegram
    command: python bot/telegram_bot.py
    environment:
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}
      - API_URL=http://api:8000
    depends_on:
      - api
    restart: unless-stopped
